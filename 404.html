<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Không tìm thấy trang · Aporia</title>
<meta name="color-scheme" content="dark">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#ececec;font:14px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
  main{max-width:420px;text-align:center}
  h1{font:700 14px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;color:#ffa31a;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid #6b4300}
  a{color:#ffa31a;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <h1>APORIA</h1>
  <p>Trang bạn mở không tồn tại.</p>
  <p><a id="home" href="/">Về lịch tin</a></p>
</main>
<script>
  /* The site normally lives at the root ("/"), e.g. aporiafx.github.io or a custom domain.
     If it is published as a project site (owner.github.io/<repo>/), link back to that folder instead. */
  (function(){
    var home = document.getElementById("home");
    var seg = location.pathname.split("/").filter(Boolean)[0];
    home.href = "/";
    if (!seg || !/\.github\.io$/.test(location.hostname)) return;
    fetch("/" + seg + "/assets/core.js", {method: "HEAD"})
      .then(function(r){ if (r.ok) home.href = "/" + seg + "/"; })
      .catch(function(){});
  })();
</script>
</body>
</html>
