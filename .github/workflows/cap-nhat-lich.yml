# Cập nhật lịch tin Forex Factory mỗi giờ và xuất bản trang lên GitHub Pages.
# Chạy khi: mỗi giờ (phút 17), khi bạn sửa file trong kho, hoặc khi bấm "Run workflow".
name: Cập nhật lịch tin

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aporia-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cal.outputs.changed }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tải lịch Forex Factory
        id: cal
        run: python3 scripts/update_calendar.py

      - name: Lưu lịch mới vào kho
        if: steps.cal.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Cập nhật lịch tin $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn mới nhất
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói trang
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
