# Cập nhật lịch tin Forex Factory và xuất bản trang lên GitHub Pages.
# Chạy khi:
#   - khoảng 5 phút một lần: mức dày nhất GitHub cho phép, và Forex Factory chỉ cho tải tối đa 2 lần mỗi 5 phút;
#   - 6:00 sáng thứ Hai giờ Việt Nam: nạp lại lịch cả tuần (ghi lại kể cả khi không đổi);
#   - khi bấm "Run workflow": tải lịch ngay;
#   - khi bạn sửa file trong kho: chỉ đăng lại trang, không tải lịch.
name: Cập nhật lịch tin

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    - cron: "0 23 * * 0"   # 23:00 UTC Chủ nhật = 6:00 sáng thứ Hai giờ Việt Nam
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aporia-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cal.outputs.changed }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Tải lịch Forex Factory
        id: cal
        if: github.event_name != 'push'
        env:
          FORCE: ${{ github.event.schedule == '0 23 * * 0' && '1' || '0' }}
        run: python3 scripts/update_calendar.py

      - name: Lưu lịch mới vào kho
        if: steps.cal.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Cập nhật lịch tin $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Dùng chung với workflow "Số liệu thực tế": mỗi lúc chỉ một lần xuất bản trang.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lấy mã nguồn mới nhất
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói trang
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
